<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430"
     role="img" aria-labelledby="zagolovok opisanie"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="zagolovok">Контур исполнения регламентов: без изделия и с изделием</title>
  <desc id="opisanie">Слева разомкнутый контур: факт в систему управления
  проектами не вносят, график стареет, инвестор узнаёт о срыве поздно
  и получает штрафы. Справа замкнутый контур: изделие читает графики, шлёт
  поручение в рабочий чат, люди вносят факт обратно в систему, инвестор
  получает сводку вовремя.</desc>

  <defs>
    <marker id="ost-siniy" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="ost-seryy" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="ost-zelenyy" viewBox="0 0 10 10" refX="8.5" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>

    <!-- Человек: голова и плечи. Один знак на все фигуры схемы. -->
    <symbol id="chelovek" viewBox="0 0 24 30">
      <circle cx="12" cy="7" r="6"/>
      <path d="M1,30 v-6 a11,11 0 0 1 22,0 v6 z"/>
    </symbol>

    <!-- Будильник — знак изделия. По записанной аналогии: звонит, пока
         обязательство не выполнено (11710-11710-81, п. 3.1а.1). -->
    <symbol id="budilnik" viewBox="0 0 36 36">
      <g fill="none" stroke-width="2.6" stroke-linecap="round">
        <path d="M5,8 a7,7 0 0 1 8,-6"/>
        <path d="M31,8 a7,7 0 0 0 -8,-6"/>
        <circle cx="18" cy="20" r="13"/>
        <path d="M18,12 v8 l6,4" stroke-linejoin="round"/>
        <path d="M9,31 l-3.5,3.5"/>
        <path d="M27,31 l3.5,3.5"/>
      </g>
    </symbol>

    <!-- Телефон с сообщением — знак канала доставки. -->
    <symbol id="telefon" viewBox="0 0 26 40">
      <rect x="1.6" y="1.6" width="22.8" height="36.8" rx="4.5"
            fill="#ffffff" stroke-width="2.6"/>
      <g stroke="none">
        <rect x="6" y="9" width="14" height="3.2" rx="1.6"/>
        <rect x="6" y="16" width="14" height="3.2" rx="1.6"/>
        <rect x="6" y="23" width="9" height="3.2" rx="1.6"/>
      </g>
    </symbol>

    <!-- Лист-заключение. Цвет и знак задаются снаружи. -->
    <symbol id="list" viewBox="0 0 32 40">
      <rect x="1.5" y="1.5" width="29" height="37" rx="4"
            fill="#ffffff" stroke-width="2.2"/>
    </symbol>
  </defs>

  <rect width="980" height="430" rx="16" fill="#ffffff"/>
  <line x1="490" y1="24" x2="490" y2="406" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============================ БЕЗ ИЗДЕЛИЯ ============================ -->
  <g>
    <rect x="60" y="24" width="170" height="30" rx="15" fill="#fef2f2"/>
    <text x="145" y="44" text-anchor="middle" font-size="15" font-weight="600"
          fill="#b91c1c">Без изделия</text>

    <!-- Инвестор с заключением -->
    <use href="#chelovek" x="58" y="90" width="34" height="42" fill="#94a3b8"/>
    <g transform="translate(104,90)">
      <use href="#list" width="32" height="40" stroke="#dc2626"/>
      <path d="M10,14 l12,12 M22,14 l-12,12" stroke="#dc2626" stroke-width="2.8"
            stroke-linecap="round"/>
    </g>
    <text x="97" y="152" text-anchor="middle" font-size="13" fill="#475569">Инвестор</text>
    <text x="97" y="170" text-anchor="middle" font-size="12.5" font-weight="600"
          fill="#dc2626">срыв и штрафы</text>

    <!-- Plan-R -->
    <g transform="translate(70,190)">
      <rect width="150" height="62" rx="12" fill="#f1f5f9"
            stroke="#94a3b8" stroke-width="2"/>
      <text x="75" y="28" text-anchor="middle" font-size="15" font-weight="600"
            fill="#334155">Plan-R</text>
      <g fill="#94a3b8">
        <rect x="35" y="40" width="42" height="6" rx="3"/>
        <rect x="52" y="50" width="30" height="6" rx="3"/>
        <rect x="70" y="40" width="26" height="6" rx="3" opacity="0.5"/>
      </g>
    </g>

    <!-- Пустое место там, где в правой панели стоит изделие. Пустота и есть
         содержание: недостающего звена нет, и это видно глазом. -->
    <g transform="translate(268,190)">
      <rect width="150" height="62" rx="12" fill="none" stroke="#e2e8f0"
            stroke-width="2" stroke-dasharray="6 6"/>
      <text x="75" y="30" text-anchor="middle" font-size="12.5" fill="#b91c1c">
        график стареет
      </text>
      <text x="75" y="48" text-anchor="middle" font-size="12.5" fill="#b91c1c">
        67–193 суток
      </text>
    </g>

    <!-- Люди -->
    <g fill="#94a3b8">
      <use href="#chelovek" x="204" y="330" width="30" height="37"/>
      <use href="#chelovek" x="238" y="322" width="34" height="42"/>
      <use href="#chelovek" x="276" y="330" width="30" height="37"/>
    </g>
    <text x="244" y="386" text-anchor="middle" font-size="13" fill="#475569">
      ГИП, прораб, подрядчик
    </text>

    <!-- Разорванная связь: факт не вносят -->
    <path d="M232,318 C196,312 150,296 146,264" fill="none" stroke="#cbd5e1"
          stroke-width="2.4" stroke-dasharray="7 6"/>
    <g transform="translate(176,296)">
      <circle r="14" fill="#ffffff" stroke="#dc2626" stroke-width="2.4"/>
      <path d="M-5.5,-5.5 l11,11 M5.5,-5.5 l-11,11" stroke="#dc2626"
            stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <text x="176" y="336" text-anchor="middle" font-size="12.5" font-weight="600"
          fill="#b91c1c">факт не вносят</text>

    <!-- Инвестор узнаёт поздно -->
    <path d="M196,186 C186,158 166,140 146,132" fill="none" stroke="#cbd5e1"
          stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#ost-seryy)"/>
    <text x="204" y="162" font-size="12.5" fill="#64748b">узнаёт поздно</text>

    <text x="244" y="412" text-anchor="middle" font-size="13" font-weight="700"
          fill="#b91c1c">контур разомкнут</text>
  </g>

  <!-- ============================ С ИЗДЕЛИЕМ ============================ -->
  <g transform="translate(490,0)">
    <rect x="60" y="24" width="170" height="30" rx="15" fill="#eef2ff"/>
    <text x="145" y="44" text-anchor="middle" font-size="15" font-weight="600"
          fill="#1d4ed8">С изделием</text>

    <!-- Инвестор с заключением -->
    <use href="#chelovek" x="58" y="90" width="34" height="42" fill="#1d4ed8"/>
    <g transform="translate(104,90)">
      <use href="#list" width="32" height="40" stroke="#16a34a"/>
      <path d="M9,20 l6,6 l10,-13" fill="none" stroke="#16a34a" stroke-width="2.9"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="97" y="152" text-anchor="middle" font-size="13" fill="#334155">Инвестор</text>
    <text x="97" y="170" text-anchor="middle" font-size="12.5" font-weight="600"
          fill="#16a34a">знает вовремя</text>

    <!-- Plan-R -->
    <g transform="translate(70,190)">
      <rect width="150" height="62" rx="12" fill="#f1f5f9"
            stroke="#94a3b8" stroke-width="2"/>
      <text x="75" y="28" text-anchor="middle" font-size="15" font-weight="600"
            fill="#334155">Plan-R</text>
      <g fill="#94a3b8">
        <rect x="35" y="40" width="42" height="6" rx="3"/>
        <rect x="52" y="50" width="30" height="6" rx="3"/>
        <rect x="70" y="40" width="26" height="6" rx="3" opacity="0.5"/>
      </g>
    </g>

    <!-- АРХИ -->
    <g transform="translate(280,190)">
      <rect width="150" height="62" rx="12" fill="#eef2ff"
            stroke="#6366f1" stroke-width="2.4"/>
      <use href="#budilnik" x="14" y="13" width="36" height="36"
           stroke="#1d4ed8"/>
      <text x="100" y="28" text-anchor="middle" font-size="15" font-weight="600"
            fill="#1d4ed8">АРХИ</text>
      <text x="100" y="46" text-anchor="middle" font-size="11.5" fill="#4f46e5">
        регламенты
      </text>
    </g>

    <!-- ① Plan-R → АРХИ -->
    <path d="M226,221 L274,221" fill="none" stroke="#1d4ed8" stroke-width="2.6"
          marker-end="url(#ost-siniy)"/>
    <text x="250" y="210" text-anchor="middle" font-size="12.5" fill="#1d4ed8">читает</text>

    <!-- ② АРХИ → люди: поручение в рабочий чат -->
    <path d="M355,256 C355,300 336,324 302,332" fill="none" stroke="#1d4ed8"
          stroke-width="2.6" marker-end="url(#ost-siniy)"/>
    <use href="#telefon" x="364" y="278" width="26" height="40"
         stroke="#1d4ed8" fill="#1d4ed8"/>
    <text x="398" y="303" font-size="12.5" fill="#1d4ed8">поручение</text>

    <!-- Люди -->
    <g fill="#1d4ed8">
      <use href="#chelovek" x="204" y="330" width="30" height="37"/>
      <use href="#chelovek" x="238" y="322" width="34" height="42"/>
      <use href="#chelovek" x="276" y="330" width="30" height="37"/>
    </g>
    <text x="244" y="386" text-anchor="middle" font-size="13" fill="#334155">
      ГИП, прораб, подрядчик
    </text>

    <!-- ③ Люди → Plan-R: контур замыкается -->
    <path d="M198,334 C168,326 146,300 146,264" fill="none" stroke="#16a34a"
          stroke-width="2.6" marker-end="url(#ost-zelenyy)"/>
    <text x="128" y="306" text-anchor="end" font-size="12.5" font-weight="600"
          fill="#15803d">вносят факт</text>

    <!-- ④ АРХИ → инвестор: сводка, дугой поверх всего -->
    <path d="M342,186 C310,124 212,104 146,112" fill="none" stroke="#1d4ed8"
          stroke-width="2.4" marker-end="url(#ost-siniy)"/>
    <text x="248" y="108" text-anchor="middle" font-size="12.5" fill="#1d4ed8">
      сводка и эскалация
    </text>

    <text x="244" y="412" text-anchor="middle" font-size="13" font-weight="700"
          fill="#15803d">контур замкнут</text>
  </g>
</svg>
